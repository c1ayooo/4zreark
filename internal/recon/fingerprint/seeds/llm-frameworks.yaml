# LLM 推理框架指纹规则种子（AI 协议暴露面识别 · 路线 A 治理融合）
# 依据：docs/开源对标-AgentScan-AI协议暴露面识别与接入方案.md；表达式来自 AgentScan
# pkg/llmtpl/templates/llm/*.yaml 的 stage1 matcher（v1.1.0，MIT，一次性搬运+钉版本）。
# matcher 只用 body=/header=（包含匹配），与 internal/fingerprint 的 DSL 天然兼容
# （knownFields 支持 body/header/status），由 LoadRuleSeedsFromDir 幂等入库 source=custom，
# 不被上游自动同步覆盖。rules 里 product name = 框架名（如 ollama），
# 证据配套 internal/aiprobe 深度探测（版本/模型清单/认证态）。
rules:
- name: aphrodite-engine
  category: LLM-Framework
  enabled: true
  expression: (body="\"Aphrodite Engine\"" && body="\"software\"")
  note: LLM 推理框架（AgentScan llmtpl aphrodite-engine.yaml stage1，severity=high）；深度探测用
    llm_endpoint_scan
- name: bentoml
  category: LLM-Framework
  enabled: true
  expression: (body="bentoml_api_server")
  note: LLM 推理框架（AgentScan llmtpl bentoml.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: deepspeed-mii
  category: LLM-Framework
  enabled: true
  expression: (body="\"deepspeed-mii\"")
  note: LLM 推理框架（AgentScan llmtpl deepspeed-mii.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: fastchat
  category: LLM-Framework
  enabled: true
  expression: (body="model_names")
  note: LLM 推理框架（AgentScan llmtpl fastchat.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: gpt4all
  category: LLM-Framework
  enabled: true
  expression: (body="\"owned_by\":\"humanity\"")
  note: LLM 推理框架（AgentScan llmtpl gpt4all.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: instructlab
  category: LLM-Framework
  enabled: true
  expression: (body="Hello from InstructLab! Visit us at https://instructlab.ai")
  note: LLM 推理框架（AgentScan llmtpl instructlab.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: jan
  category: LLM-Framework
  enabled: true
  expression: '(body="\"title\": \"Jan API Server Endpoints\"")'
  note: LLM 推理框架（AgentScan llmtpl jan.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: koboldcpp
  category: LLM-Framework
  enabled: true
  expression: '(body="\"result\": \"KoboldCpp\"")'
  note: LLM 推理框架（AgentScan llmtpl koboldcpp.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: litellm
  category: LLM-Framework
  enabled: true
  expression: (body="LiteLLM API" || body="Proxy Server to call 100+ LLMs" || body="LiteLLM
    Admin Panel")
  note: LLM 推理框架（AgentScan llmtpl litellm.yaml stage1，severity=critical）；深度探测用 llm_endpoint_scan
- name: llama-cpp
  category: LLM-Framework
  enabled: true
  expression: (body="\"owned_by\":\"llamacpp\"")
  note: LLM 推理框架（AgentScan llmtpl llama-cpp.yaml stage1，severity=high）；深度探测用 llm_endpoint_scan
- name: lm-studio
  category: LLM-Framework
  enabled: true
