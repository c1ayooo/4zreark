# SaaS 域名特征表（对标 Desinter_scan site_metadata collector §5.3）：
# 匹配目标子域/关联域名时，识别其使用的第三方 SaaS 服务——攻防两端均有价值
# （攻击面打点选择 + 供应链风险判断）。
# 新增规则：追加条目到 services[]，pattern 正则匹配全小写域名，命中即返回服务信息。
version: 1
services:
  # ── 协作与项目管理 ──
  - id: zendesk
    name: Zendesk
    label: Zendesk 工单系统
    category: 客服
    patterns: ["(?:[^/]+\\.)?zendesk\\.com$", "(?:[^/]+\\.)?zendesk\\.co\\.[a-z]{2}$"]
  - id: atlassian
    name: Atlassian
    label: Atlassian (Jira/Confluence/Bitbucket)
    category: 协作
    patterns: ["(?:[^/]+\\.)?atlassian\\.net$", "(?:[^/]+\\.)?atlassian\\.com$"]
  - id: intercom
    name: Intercom
    label: Intercom 客服/消息
    category: 客服
    patterns: ["(?:[^/]+\\.)?intercom\\.io$", "(?:[^/]+\\.)?intercom\\.com$"]
  - id: helpscout
    name: Help Scout
    label: Help Scout 帮助中心
    category: 客服
    patterns: ["(?:[^/]+\\.)?helpscoutdocs\\.com$", "(?:[^/]+\\.)?helpscoutapp\\.com$"]
  - id: freshdesk
    name: Freshdesk
    label: Freshdesk/Freshworks 工单
    category: 客服
    patterns: ["(?:[^/]+\\.)?freshdesk\\.com$", "(?:[^/]+\\.)?freshworks\\.com$"]
  - id: slack
    name: Slack
    label: Slack 工作区
    category: 通讯
    patterns: ["(?:[^/]+\\.)?slack\\.com$", "(?:[^/]+\\.)?slack\\.co\\.[a-z]{2}$"]
  - id: microsoft_teams
    name: Microsoft Teams
    label: Microsoft Teams
    category: 通讯
    patterns: ["(?:[^/]+\\.)?teams\\.microsoft\\.com$", "(?:[^/]+\\.)?web\\.teams\\.microsoft\\.com$"]
  # ── 状态页与文档 ──
  - id: statuspage
    name: Statuspage
    label: Statuspage.io 状态页
    category: 状态监控
    patterns: ["(?:[^/]+\\.)?statuspage\\.io$", "(?:[^/]+\\.)?status\\.io$"]
  - id: readme
    name: ReadMe
    label: ReadMe API 文档
    category: 文档
    patterns: ["(?:[^/]+\\.)?readme\\.io$"]
  - id: gitbook
    name: GitBook
    label: GitBook 文档
    category: 文档
    patterns: ["(?:[^/]+\\.)?gitbook\\.io$", "(?:[^/]+\\.)?gitbook\\.com$"]
  - id: postman
    name: Postman
    label: Postman 公开 API 文档
    category: 文档
    patterns: ["(?:[^/]+\\.)?getpostman\\.com$", "(?:[^/]+\\.)?app\\.postman\\.co$"]
  # ── 静态托管与无服务器 ──
  - id: github_pages
    name: GitHub Pages
    label: GitHub Pages 静态托管
    category: 静态托管
    patterns: ["[a-z0-9-]+\\.github\\.io$"]
  - id: vercel
    name: Vercel
    label: Vercel 部署
    category: 无服务器托管
    patterns: ["[a-z0-9-]+\\.vercel\\.app$", "[a-z0-9-]+\\.vercel\\.dev$"]
  - id: netlify
    name: Netlify
    label: Netlify 部署
    category: 无服务器托管
    patterns: ["[a-z0-9-]+\\.netlify\\.app$", "[a-z0-9-]+\\.netlify\\.com$"]
  - id: heroku
    name: Heroku
    label: Heroku 应用
    category: PaaS
    patterns: ["[a-z0-9-]+\\.herokuapp\\.com$", "[a-z0-9-]+\\.herokuapp\\.com$"]
  - id: cloudflare_pages
    name: Cloudflare Pages
    label: Cloudflare Pages
    category: 静态托管
    patterns: ["[a-z0-9-]+\\.pages\\.dev$"]
  - id: render
    name: Render
    label: Render 部署
    category: PaaS
    patterns: ["[a-z0-9-]+\\.onrender\\.com$"]
  - id: railway
    name: Railway
    label: Railway 部署
    category: PaaS
    patterns: ["[a-z0-9-]+\\.up\\.railway\\.app$"]
  # ── 电商与支付 ──
  - id: stripe
    name: Stripe
    label: Stripe 支付
    category: 支付
    patterns: ["(?:[^/]+\\.)?stripe\\.com$", "(?:[^/]+\\.)?stripe\\.network$"]
  - id: shopify
    name: Shopify
    label: Shopify 电商
    category: 电商
    patterns: ["(?:[^/]+\\.)?shopify\\.com$", "(?:[^/]+\\.)?myshopify\\.com$"]
  - id: paypal
    name: PayPal
    label: PayPal 支付
    category: 支付
    patterns: ["(?:[^/]+\\.)?paypal\\.com$", "(?:[^/]+\\.)?paypalobjects\\.com$"]
  # ── 营销与分析 ──
  - id: mailchimp
    name: Mailchimp
    label: Mailchimp 邮件营销
    category: 营销
    patterns: ["(?:[^/]+\\.)?mailchimp\\.com$", "(?:[^/]+\\.)?list-manage\\.com$", "(?:[^/]+\\.)?mcsv\\.net$"]
  - id: hubspot
    name: HubSpot
    label: HubSpot CRM/营销
    category: 营销
    patterns: ["(?:[^/]+\\.)?hubspot\\.com$", "(?:[^/]+\\.)?hs-sites\\.com$"]
  - id: launchdarkly
    name: LaunchDarkly
    label: LaunchDarkly 功能开关
    category: 功能管理
    patterns: ["(?:[^/]+\\.)?launchdarkly\\.com$"]
  # ── 知识库与笔记 ──
  - id: notion
    name: Notion
    label: Notion 知识库
    category: 知识库
    patterns: ["(?:[^/]+\\.)?notion\\.so$", "(?:[^/]+\\.)?notion\\.site$"]
  - id: confluence_cloud
    name: Confluence Cloud
    label: Confluence 云文档（归入 Atlassian 单独识别）
    category: 文档
    patterns: ["(?:[^/]+\\.)?atlassian\\.wiki$", "[a-z0-9-]+\\.confluence\\.com$"]
  # ── 身份认证 ──
  - id: auth0
    name: Auth0
    label: Auth0 身份认证
    category: 认证
    patterns: ["(?:[^/]+\\.)?auth0\\.com$", "[a-z0-9-]+\\.us\\.auth0\\.com$"]
  - id: cognito
    name: AWS Cognito
    label: AWS Cognito 用户池
    category: 认证
    patterns: ["[a-z0-9-]+\\.auth\\.[a-z0-9-]+\\.amazoncognito\\.com$"]
