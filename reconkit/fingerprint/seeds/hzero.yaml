# HZERO（上海汉得 · 低代码/微服务开发平台）指纹规则种子
# 依据：HZERO v1.5 公开源码（附件 API 目录）+ 真实目标 recon 观测特征：
#   - xsrm_login.html（小鹏 SRM）：body 含 "汉得信息" / "hand-china.com" 版权，
#     大量 /oauth/static/default/... 静态资源、/spfm/v1/ 网关路径、tenantId cookie
#   - srm_hzero-front-components.<hash>.chunk.js：HZERO 前端 C7N 组件包
# 规则入库后 product name = HZERO（小写归一 "hzero"），证据解锁 hzero-exploitation skill。
# 来源 source=custom，不被上游自动同步覆盖；启用后 60s 缓存生效。
rules:
  - name: "HZERO"
    category: "Java-Framework"
    enabled: true
    expression: 'body="汉得信息" || body="hand-china.com" || body="oauth/static/default"'
    note: "HZERO 页脚版权 + oauth 模块静态资源路径（登录页/门户页，实测命中）"
  - name: "HZERO"
    category: "Java-Framework"
    enabled: true
    expression: 'body="hzero-front" || body="hzero-front-components"'
    note: "HZERO C7N 前端 webpack chunk 命名特征（SPA index.html 内嵌）"
  - name: "HZERO"
    category: "Java-Framework"
    enabled: true
    expression: 'body="spfm/v1/" || body="/spfm/v1/"'
    note: "HZERO 服务网关模块路径（spfm=门户管理），登录页/JS bundle 内引用（实测）"
  - name: "HZERO"
    category: "Java-Framework"
    enabled: true
    expression: 'title ~= "(?i)hzero"'
    note: "标题含 hzero（部分部署保留默认标题）"