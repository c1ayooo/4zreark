# Moon Gazing Tower Configuration

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"  # debug, release, test
  public_url: ""   # 平台对外访问地址（通知「前往处置」按钮链接前缀），如 http://x.x.x.x:8080
  # 原生 TLS（审计 M11）：成对配置后主 Web 直接 HTTPS，无需反代。
  # tls_cert: "/etc/4zreark/tls/fullchain.pem"
  # tls_key:  "/etc/4zreark/tls/privkey.pem"
  tls_cert: ""
  tls_key: ""
  # 强制 HTTPS：反向代理终止 TLS 的部署开启后，明文请求 301 到 https 并下发 HSTS。
  # 环境变量 ZRE_FORCE_HTTPS / ZRE_TLS_CERT / ZRE_TLS_KEY 可覆盖。
  force_https: false

auth:
  # 公开注册默认关闭（审计 H1）：空注册码一律拒绝；显式开启后新账号才允许无码注册
  # （默认只读角色）。环境变量 ZRE_ALLOW_PUBLIC_REGISTRATION 可覆盖。
  allow_public_registration: false

jwt:
  # 留空：随仓库分发的可用密钥等于人人可签出 admin JWT，守卫会拒绝启动控制面。
  # 部署必须设置，或显式 ZRE_ALLOW_DEFAULT_SECRET=1 放行；推荐环境变量
  # ZRE_JWT_SECRET（如 openssl rand -hex 32 的输出），密钥不进 git。
  secret: ""
  expire: 7200  # 2 hours in seconds
  issuer: "4zreark"

postgres:
  host: "127.0.0.1"
  port: 25433
  user: "zre"
  password: ""
  dbname: "zreark"
  schema: "zre"
  sslmode: "disable"
  max_conns: 50
  min_conns: 5

# 已决定移除 Redis：队列 / 去重 / 登出由 PG 承担。该段待代码层删掉 go-redis 后一并移除
scanner:
  worker_count: 10
  timeout: 300
  retry_count: 3
  # 默认 false：终态任务的僵尸 River job 只 JobCancel，交给 River 回收；
  # 只有极端运维场景才显式开启强删（会写审计日志）。
  force_clean_terminal_jobs: false
  # 全局禁扫黑名单：与任务级授权边界（项目种子 scope）叠加，命中即拒绝。
  # 域名后缀匹配后缀本身及所有子域；CIDR 用无类别域间路由格式。
  # 默认保护 gov.cn；显式写空列表（[]）可整体关闭某一维。
  deny_domain_suffixes: ["gov.cn"]
  deny_cidrs: []
  # nuclei 误报黑名单：按 template-id 永久排除（对应 nuclei -eid）。
  # 单个任务的 config.deny_template_ids 盖章值优先于这里的兜底值。
  nuclei_deny_template_ids: []

# 信息收集预设与阶段编排。
# enabled=false 时保持旧行为（按任务类型硬编码模块集），用于一键回滚。
# mode=auto：环境正常走单链，工具缺失/目标过大/近期失败率高时自动切 staged。
collection:
  enabled: true
  mode: auto
  default_modules:
    - subdomain
    - takeover
    - http_probe
    - port_scan
    - fingerprint
    - crawler
    - js_audit
    - api_probe
    - dir_scan
    - sensitive
  exclude_modules:
    - vuln_scan
    - bruteforce
    - gogo_poc
  max_targets_for_full: 500
  # 单站开放端口超过该值时做纯 Go TCP 二次复核；复核后仍超阈值只保留常见端口。
  max_ports_per_host: 200
  min_online_nodes: 1
  max_fail_rate: 0.3
  stage_timeout_minutes: 360
  site_scope: host
  # 收集侧 AI Gate：off 关闭；shadow 只判定不路由；enforce 允许规则层消费。
  # 默认 off，先离线/影子跑，避免模型不稳定影响收集主链。
  gate_mode: off
  gate_workers: 4

# 分布式扫描节点。
#   role=all    单机模式（默认）：Web + 本机扫描，本地持有 PostgreSQL
#   role=master 控制面：持有 PostgreSQL/River，把任务通过 WebSocket 推给 worker
#   role=worker 扫描节点：不连接数据库，只用 platform_url + token 连平台
node:
  id: ""                    # 节点唯一标识，默认取 name（同机多节点时必须显式区分）
  name: ""                  # 展示名，默认取 hostname
  role: "master"
  platform_url: ""          # worker 必填：https://master:9443
  token: ""                 # worker 必填：平台签发的节点密钥（可吊销）
  platform_ca: ""           # worker 可选：节点网关自签证书路径；一键部署会自动写入
  proxy: ""                 # worker 可选：socks5://user:pass@relay:1080 或 http://relay:8080
  gateway_port: 9443        # 节点专用 TLS 端口，不能和 server.port 相同
  gateway_host: ""          # 证书 SAN / 默认节点网关地址，留空用本机 hostname/IP
  tls_cert: ""              # 自定义节点网关证书，留空自动生成自签证书
  tls_key: ""               # 自定义节点网关私钥
  tls_ca: ""                # 自定义 CA；留空时用 tls_cert/自签证书作为 worker 信任根
  tls_dir: "data/node-tls"  # 自签证书存放目录
  windows_binary: ""        # 一键部署 Windows 时使用的 worker.exe 路径，留空则在 server 同目录找 worker-windows-amd64.exe
  rem_binary: ""            # rem 反连隧道二进制路径，留空用工具运行时托管版本（data/tools）
  tunnel_dir: ""            # rem 隧道记录目录，留空用 /tmp/4zreark-tunnels；主机重启后要恢复请改成持久目录
  max_tasks: 5              # 单节点同时执行的任务数（River MaxWorkers，启动时生效）
  heartbeat_interval: 30    # 心跳秒数
  tags: []                  # 例如 ["overseas", "high-performance"]
  capabilities: []          # 留空 = 默认全能力

# 第三方 API 配置 (用于子域名收集)
thirdparty:
  fofa:
    key: ""
  hunter:
    key: ""
  quake:
    key: ""
  zoomeye:
    key: ""
  shodan:
    key: ""
  crtsh:
    enabled: true

# 站点存活自动验证：新扫描/导入的 pending 站点后台按批次真实探测。
# enabled 缺省视为 true；显式 false（或环境变量 ZRE_AUTOVERIFY_ENABLED=0）关闭。
site_liveness:
  enabled: true
  parallel: 4
  batch_limit: 20
  interval_sec: 30
  delay_ms: 200

# 指纹命中后的自动 nuclei 最小验证（默认关闭；开启前确认项目种子即授权边界）
fingerprint_verify:
  enabled: false
  recheck_days: 7
  concurrency: 1
  rate_limit: 10

# MCP 治理参数（工具总闸与配额持久化在 app_settings，此处为配置文件兜底值）
mcp:
  rate_limit_per_min: 60

# 提交哨兵（CommitSentinel v0.3）：采集公开仓库提交 → 判定是否为安全修复。
# 默认关闭；开启前确认 mirror 目录可写、磁盘够用。密钥不落配置文件。
sentinel:
  enabled: true
  mirror_dir: "data/sentinel-mirrors"
  clone_hosts:
    - github.com
  collect_interval_minutes: 60
  collect_workers: 2
  judge_workers: 3
  max_commits_per_run: 50
  token_budget: 10000
  max_hunk_lines: 40
  judge_model: "deepseek-v4.1-flash"
  # 高危（high/critical）命中后自动二轮深审：从本地 mirror 读变更文件全文细查一次，
  # 落 deep-analysis 草稿产物。每个高危发现多一次 LLM 调用；false 关闭。
  deep_analysis: true
  # 高危发现自动追加的验证产物（全部落 draft，人工 verified 才发布/复现）。
  # 依次为：Python 验证脚本（web 类）、利用文档（web 类）、nuclei 模板
  # （web 漏洞类自动草拟；S 级不受此项限制始终草拟）。每项默认开启。
  auto_artifacts:
    python_poc: true
    exploit_guide: true
    nuclei_web: true
  # POC 靶场验证（Tier 3b）：python-poc 人工 verified 后自动入队——docker 拉公开
  # 靶场镜像（AI 出环境方案，受 image_allow 白名单约束）起 --internal 隔离内网
  # 靶场，PoC 在网络内打靶场判定可行性；无外网出口。worker 在 pocsmith 进程。
  poc_verify:
    enabled: true
    python_image: "python:3.11-slim"
    image_allow:
      - "vulhub/"
      - "ghcr.io/"
    max_wait_seconds: 120
  enable_audit_queue: false
  queue_poll_seconds: 30

# 模型接入：任意 OpenAI 兼容端点（OpenAI / DeepSeek / Qwen / 自建 vLLM）。
# 密钥只从 api_key_env 指定的环境变量读取（默认 ZRE_LLM_API_KEY）。
llm:
  base_url: "https://api.openai.com/v1"
  api_key_env: "ZRE_LLM_API_KEY"
  model: "gpt-4o-mini"
  timeout_seconds: 90
  max_retries: 2
  temperature: 0
  max_tokens: 2048
  prompt_cost_per_1k: 0
  completion_cost_per_1k: 0
