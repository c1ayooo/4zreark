# 单机部署编排。存储只有 PostgreSQL 16（代码已全面 PG 化，
# 不再依赖 MongoDB / Redis；旧 compose 里的 mongo/redis 已移除）。
# 镜像默认取 GitHub 官方容器仓库（ghcr.io）的发布版；本地改动用
# `docker compose build app` 构建（Dockerfile 多阶段，前端在镜像内构建）。
# 凭据通过环境变量注入，不要写死在文件里：
#   ZRE_PG_PASSWORD  数据库密码（必需）
#   ZRE_JWT_SECRET   JWT 签名密钥（必需，openssl rand -hex 32）
services:
  postgres:
    image: postgres:16-alpine
    container_name: zreark_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=zre
      - POSTGRES_DB=zreark
      - POSTGRES_PASSWORD=${ZRE_PG_PASSWORD:?需要设置 ZRE_PG_PASSWORD}
    # PG 资源：与 app 连接池（max_conns=50）匹配，留出 maintenance 连接。
    command:
      - "postgres"
      - "-c"
      - "max_connections=80"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
    volumes:
      - pg_data:/var/lib/postgresql/data
    # 审计 M11：数据库只绑本机回环，不对宿主机网卡发布；
    # 容器网内 app 经服务名 postgres 访问。确需外部调试时临时改 127.0.0.1 已足够。
    ports:
      - "127.0.0.1:25433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zre -d zreark"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    # 发布版：ghcr.io 自动构建（Release 工作流，多架构 amd64/arm64）。
    # 本地构建：docker compose build app（image 标签会被 build 覆盖）。
    image: ghcr.io/c1ayooo/4zreark:${ZRE_IMAGE_TAG:-latest}
    container_name: zreark_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9443:9443"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # config 覆盖镜像内模板（不覆盖也能起：真实凭据走环境变量）；
      # tools 是外部扫描工具（gitignore 不入库），按宿主机路径挂载。
      - ./config:/app/config:ro
      - ./tools:/app/tools:ro
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - ZRE_FRONTEND_DIST=/app/frontend/dist
      - ZRE_PG_HOST=postgres
      - ZRE_PG_PORT=5432
      - ZRE_PG_USER=zre
      - ZRE_PG_DBNAME=zreark
      - ZRE_PG_PASSWORD=${ZRE_PG_PASSWORD}
      - ZRE_JWT_SECRET=${ZRE_JWT_SECRET:?需要设置 ZRE_JWT_SECRET}
      # 传输安全（审计 M11）：反代终止 TLS 时置 force_https=1（明文 301 + HSTS）；
      # 无反代时可挂载证书走原生 TLS：ZRE_TLS_CERT/ZRE_TLS_KEY 指向容器内路径。
      # - ZRE_FORCE_HTTPS=1
      # - ZRE_TLS_CERT=/app/tls/fullchain.pem
      # - ZRE_TLS_KEY=/app/tls/privkey.pem

volumes:
  pg_data:
