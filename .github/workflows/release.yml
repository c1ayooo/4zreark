# Release 流水线：push v* 标签触发。
# 产物：
#   1. ghcr.io/c1ayooo/4zreark:<tag> 与 :latest 多架构镜像（amd64/arm64，前端在镜像内构建）
#   2. linux 二进制包（amd64/arm64）附到 GitHub Release，附 sha256 校验
# 仓库里不含任何本地数据：数据库、备份与本地文档由 .gitignore/.dockerignore 挡住，
# 镜像只携带代码、配置模板与构建产物。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/c1ayooo/4zreark

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build linux binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/4zreark_${VERSION}_linux_${arch}/server" .
            cp -r config "dist/4zreark_${VERSION}_linux_${arch}/config"
            tar -czf "dist/4zreark_${VERSION}_linux_${arch}.tar.gz" \
              -C dist "4zreark_${VERSION}_linux_${arch}"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
