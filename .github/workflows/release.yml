# Release 流水线：push v* 标签触发。
# 产物：
#   1. ghcr.io/c1ayooo/4zreark:<tag> 与 :latest 多架构镜像（amd64/arm64，前端在镜像内构建）
#   2. linux 二进制包（amd64/arm64）附到 GitHub Release，附 sha256 校验
#
# 架构说明：镜像构建按平台拆成两个原生 runner（amd64=ubuntu-latest、
# arm64=ubuntu-24.04-arm），各自原生构建零 QEMU 仿真，最后 imagetools 合并
# manifest。此前的单 job buildx 双架构会在 QEMU 里编译 Go/arm64，实测撞上
# GitHub 6 小时 job 上限被取消（v0.1.1 教训）。
# 仓库里不含任何本地数据：数据库、备份与本地文档由 .gitignore/.dockerignore 挡住，
# 镜像只携带代码、配置模板与构建产物。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/c1ayooo/4zreark

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Build linux binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.AppVersion=${VERSION}" \
              -o "dist/4zreark_${VERSION}_linux_${arch}/server" .
            cp -r config "dist/4zreark_${VERSION}_linux_${arch}/config"
            tar -czf "dist/4zreark_${VERSION}_linux_${arch}.tar.gz" \
              -C dist "4zreark_${VERSION}_linux_${arch}"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 1

  image-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push (amd64, native)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push (arm64, native)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  release:
    needs: [binaries, image-amd64, image-arm64]
    # ubuntu-latest 池在 release job 上连续三次 Set up job failure（同 run 的
    # binaries/image-amd64 都成功）；换固定版本池绕开。
    runs-on: ubuntu-24.04
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Merge multi-arch manifest
        run: |
          DIGEST_A=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}-amd64" --format '{{json .Manifest.Digest}}' | tr -d '"')
          DIGEST_B=$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}-arm64" --format '{{json .Manifest.Digest}}' | tr -d '"')
          docker buildx imagetools create \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}@${DIGEST_A}" "${IMAGE}@${DIGEST_B}"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896ecc90649cb94a # v4
        with:
          name: release-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
